<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" value="0" disabled>
    <div class="buttons">
                <button class="btn btn-top">%</button>
                <button class="btn btn-top">CE</button>
                <button class="btn btn-top">C</button>
                <button class="btn btn-top">&#9003;</button>
                <button class="btn btn-sci">sin</button>
                <button class="btn btn-sci">cos</button>
                <button class="btn btn-sci">tan</button>
                <button class="btn btn-sci">Rad</button>
                <button class="btn btn-sci">&pi;</button>     
                <button class="btn btn-sci">ln</button>
                <button class="btn btn-sci">x!</button>       
                <button class="btn btn-sci">&#8731;x</button> 
                <button class="btn">1/x</button>
                <button class="btn">x²</button>
                <button class="btn">√x</button>
                <button class="btn btn-op">÷</button>
                <button class="btn">7</button>
                <button class="btn">8</button>
                <button class="btn">9</button>
                <button class="btn btn-op">×</button>
                <button class="btn">4</button>
                <button class="btn">5</button>
                <button class="btn">6</button>
                <button class="btn btn-op">-</button>
                <button class="btn">1</button>
                <button class="btn">2</button>
                <button class="btn">3</button>
                <button class="btn btn-op">+</button>
                <button class="btn">+/-</button>
                <button class="btn">0</button>
                <button class="btn">.</button>
                <button class="btn btn-op">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
